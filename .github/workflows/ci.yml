name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t chain-data-service:ci .

      - name: Smoke test
        run: |
          docker run -d --name api -p 127.0.0.1:4000:4000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -e DMD_DB_API_HOST=127.0.0.1 \
            chain-data-service:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1

  ci-required:
    name: ci-required
    if: always()
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          BUILD: ${{ needs.build.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "build=$BUILD image=$IMAGE"
          test "$BUILD" = "success"
          test "$IMAGE" = "success"
