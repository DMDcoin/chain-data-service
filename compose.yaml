services:
  api:
    build: .
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=${PORT:-4000}
      - NODE_ENV=${NODE_ENV:-production}
      - DMD_DB_API_PASS=${DMD_DB_API_PASS:?set DMD_DB_API_PASS in .env}
      - REDIS_URL=redis://redis:6379
    ports:
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
